name: Crawl and Deploy

on:
  schedule:
    - cron: '7 * * * *'  # Every hour (offset from :00 to reduce load)
  workflow_dispatch:        # Manual trigger

# A single wedged run must never starve the hourly schedule.
#
# With cancel-in-progress: false, GitHub keeps at most ONE pending run per
# group and cancels the previously-pending one each time a new run queues. So
# when run #2709 parked in `waiting` on the github-pages environment gate on
# 2026-08-06, it held this group indefinitely and every subsequent hourly run
# was queued then cancelled — ~200 consecutive cancelled runs and 9 days of
# stale data, with no failure notification because "cancelled" isn't "failed".
#
# cancel-in-progress: true makes the newest run win. In healthy operation this
# never fires: runs are hourly and finish in well under 20 minutes. It only
# fires when a run is stuck, which is exactly when we want it to.
#
# The group is also renamed off `crawl-deploy`. Run #2709 could not be
# cancelled — not via the API (403) and not from the UI — because a run parked
# in `waiting` on a broken environment gate does not always respond to cancel.
# Since a concurrency group is just a string, renaming it moves all future runs
# into a fresh, empty group and strands #2709 in the old one where it blocks
# nothing. That unwedges the schedule without needing to kill the stuck run.
concurrency:
  group: crawl-deploy-v2
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r crawler/requirements.txt
          pip install -r tests/requirements-test.txt

      # Fail-closed gate for CODE-only compliance: clean_html, URL validation,
      # redaction, frontend scans, user-agent/rate-limit. The DATA-content
      # tests (TestArticleSchema, TestArticleDataSafety) are deliberately
      # EXCLUDED here — they run inside the crawl job against freshly-crawled
      # data before commit, so external content can never block a code deploy.
      - name: Run code compliance tests
        run: |
          python -m pytest tests/test_compliance.py -v --tb=short \
            -k "not TestArticleSchema and not TestArticleDataSafety"

  crawl:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install crawler + test dependencies
        run: |
          pip install -r crawler/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run crawler
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_ACTIONS: "true"
          CRAWL_TIMEOUT: "15"
          MAX_CRAWL_TIME: "480"
          MAX_ARTICLES_PER_SOURCE: "50"
        run: python -m crawler.main

      # Re-validate the DATA-content gate against the freshly-crawled artifact
      # BEFORE commit, so the gate validates what is about to be written rather
      # than last cycle's already-committed data. The record-level admission
      # gate in crawler.main has already quarantined any unsafe records, so this
      # should pass; if it fails, something systemic slipped past and we block.
      - name: Validate freshly-crawled data (content safety + schema)
        run: |
          python -m pytest tests/test_compliance.py -v --tb=short \
            -k "TestArticleSchema or TestArticleDataSafety"

      - name: Validate articles.json
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/articles.json'))
          count = data.get('article_count', 0)
          if count == 0:
              print('ERROR: article_count is 0, blocking deploy')
              sys.exit(1)
          for i, a in enumerate(data['articles']):
              intro_len = len(a.get('intro', ''))
              if intro_len > 300:
                  print(f'ERROR: article {i} intro is {intro_len} chars')
                  sys.exit(1)
          print(f'OK: {count} articles, all intros <= 300 chars')
          "

      - name: Commit crawl data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/source_health.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update articles.json + source_health.json [bot]"

          # Retry on a moved main. `git push` with no retry drops a whole
          # crawl cycle whenever anything else lands on main mid-run.
          # On conflict the freshest crawl wins: during a rebase our replayed
          # commit is "theirs" (upstream is "ours"), so -X theirs keeps the
          # data we just crawled rather than the copy already on main.
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "ERROR: could not push after 3 attempts"
              exit 1
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch origin main
            git rebase -X theirs origin/main
          done

  deploy:
    # Decoupled from crawl SUCCESS: deploy runs as long as the code gate (test)
    # passed and the crawl job has finished its attempt — regardless of whether
    # the crawl succeeded. When the crawl commits fresh data, deploy ships it;
    # when the crawl fails, deploy still ships the last-known-good data already
    # committed on main, so a bad crawl can never freeze the site for days.
    needs: [test, crawl]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy crawl data to site
        run: |
          cp data/articles.json site/public/articles.json
          cp data/source_health.json site/public/source_health.json 2>/dev/null || true

      - name: Fetch traffic stats
        run: python scripts/fetch_traffic_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        working-directory: site
        run: |
          npm ci --force
          npm run build
          cp dist/index.html dist/404.html
          cd .. && python scripts/generate_section_og.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The outage of 2026-08-06 lasted 9 days because nothing ever went red:
  # a cancelled run is not a failed run, so GitHub never sent a notification
  # while the published site sat frozen. This job is the alarm that was
  # missing. It gates nothing — it exists purely to turn silent starvation
  # into a failed run in your inbox.
  #
  # It deliberately does NOT depend on `deploy`. A deploy job parked in
  # `waiting` on the environment gate would block this job from ever running,
  # which is precisely the failure it needs to report.
  freshness-alarm:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check crawl and deploy freshness
        env:
          MAX_AGE_HOURS: "6"
        run: python scripts/check_freshness.py
